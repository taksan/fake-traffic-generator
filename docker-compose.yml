x-logging: &logging
  driver: gelf
  options:
    gelf-address: "udp://host.docker.internal:12201"
services:
  # User Database Service
  user-database:
    build:
      context: ./user-database
    container_name: user_database
    ports:
      - "8500:8500"
    volumes:
      - user_data:/data
    networks:
      - ${NETWORK_NAME:-default}
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8500/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      <<: *logging

  # Server Assignment Service
  server-assignment:
    build:
      context: ./server-assignment
    container_name: server_assignment
    ports:
      - "8100:8100"
    volumes:
      - ../geo_servers.geojson:/app/geo_servers.geojson:ro
      - server_assignment_logs:/var/log/server-assignment
    networks:
      - ${NETWORK_NAME:-default}
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8100/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      <<: *logging

  # Traffic Generator Application
  traffic-generator:
    build:
      context: ./traffic-generator
    container_name: traffic_generator
    ports:
      - "8000:8000"
    volumes:
      - ../user_flows.yml:/app/user_flows.yml:ro
    environment:
      - USER_DB_URL=http://user-database:8500
      - SERVER_ASSIGNMENT_URL=http://server-assignment:8100
    networks:
      - ${NETWORK_NAME:-default}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      user-database:
        condition: service_started
      server-assignment:
        condition: service_started
    restart: on-failure
    logging:
      <<: *logging

volumes:
  user_data:
    driver: local
  server_assignment_logs:
    driver: local
