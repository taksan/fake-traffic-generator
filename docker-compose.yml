# Logging configuration (controlled by environment variables)
x-logging: &logging-config
  driver: ${LOGGING_DRIVER:-json-file}
  options:
    max-size: ${LOGGING_MAX_SIZE:-10m}
    max-file: ${LOGGING_MAX_FILE:-3}
    labels: ${LOGGING_LABELS:-container,service}

services:
  # User Database Service
  user-database:
    build:
      context: ./user-database
    container_name: user_database
    ports:
      - "8500:8500"
    volumes:
      - user_data:/data
    networks:
      - ${NETWORK_NAME:-default}
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8500/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Server Assignment Service
  server-assignment:
    build:
      context: ./server-assignment
    container_name: server_assignment
    ports:
      - "8100:8100"
    volumes:
      - ../geo_servers.geojson:/app/geo_servers.geojson:ro
      - server_assignment_logs:/var/log/server-assignment
    networks:
      - ${NETWORK_NAME:-default}
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8100/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Traffic Generator Application
  traffic-generator:
    build:
      context: ./traffic-generator
    container_name: traffic_generator
    ports:
      - "8000:8000"
    volumes:
      - ../user_flows.yml:/app/user_flows.yml:ro
    environment:
      - USER_DB_URL=http://user-database:8500
      - SERVER_ASSIGNMENT_URL=http://server-assignment:8100
    networks:
      - ${NETWORK_NAME:-default}
    depends_on:
      user-database:
        condition: service_started
      server-assignment:
        condition: service_started
    restart: on-failure
    logging:
      driver: gelf
      options:
        gelf-address: "udp://localhost:12201"
        tag: "traffic-generator"
